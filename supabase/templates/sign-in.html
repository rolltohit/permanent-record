<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 420px; margin: 0 auto; color: #1a1a1a">
  <h2 style="margin: 0 0 4px">Your Rec Room code</h2>
  <p style="margin: 0 0 16px; color: #555">Type this on the page where you asked for it:</p>
  <p style="margin: 0 0 20px; font-family: ui-monospace, Menlo, monospace; font-size: 34px; font-weight: 700; letter-spacing: 8px">{{ .Token }}</p>
  <p style="margin: 0 0 12px; color: #555">Or tap this button, on any phone or computer:</p>
  <p style="margin: 0 0 24px">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display: inline-block; padding: 12px 20px; border-radius: 999px; background: #d9731f; color: #fff; text-decoration: none; font-weight: 600">Sign in to Rec Room</a>
  </p>
  <p style="margin: 0; font-size: 12px; color: #888">The code and button work once, for an hour. Didn't ask for this? You can ignore this email.</p>
</div>
